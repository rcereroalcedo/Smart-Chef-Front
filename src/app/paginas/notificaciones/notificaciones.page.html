<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/app/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Notificaciones</ion-title>
    @if (noLeidas() > 0) {
      <ion-buttons slot="end">
        <ion-button (click)="leerTodas()">Leer todas</ion-button>
      </ion-buttons>
    }
  </ion-toolbar>

  <ion-toolbar>
    <ion-segment [value]="filtro()" (ionChange)="cambiarFiltro($event)">
      <ion-segment-button value="todas"><ion-label>Todas</ion-label></ion-segment-button>
      <ion-segment-button value="noLeidas">
        <ion-label>No leídas ({{ noLeidas() }})</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  @for (g of grupos(); track g.nombre) {
    <p class="titulo-grupo">{{ g.nombre }}</p>

    <ion-list [inset]="true">
      @for (n of g.items; track n.id) {
        <ion-item [button]="!n.leida" (click)="marcarLeida(n.id)">
          <div slot="start" [class]="'icono ' + visual[n.tipo].nivel">
            <ion-icon [name]="visual[n.tipo].icono"></ion-icon>
          </div>
          <ion-label>
            <h3>{{ n.titulo }}</h3>
            <p>{{ n.detalle }}</p>
          </ion-label>
          @if (!n.leida) {
            <span slot="end" class="punto"></span>
          }
        </ion-item>
      }
    </ion-list>
  } @empty {
    <app-estado-vacio
      icono="notifications-outline"
      titulo="Todo al día"
      texto="No tienes notificaciones pendientes." />
  }

</ion-content>
