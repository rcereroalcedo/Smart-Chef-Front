<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">perfil</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-list [inset]="true">
    <ion-item>
      <ion-icon slot="start" name="moon-outline"></ion-icon>
      <ion-toggle (ionChange)="cambiarTema($event)">Modo oscuro</ion-toggle>
    </ion-item>
  </ion-list>
</ion-content>
<ion-button color="danger" expand="block" routerLink="/login" routerDirection="root">
  Cerrar sesión
</ion-button>
