<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Crea tu cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>Mira recetas y guarda tu lista de la compra</p>

  <ion-input label="Nombre" labelPlacement="floating"></ion-input>
  <ion-input label="Correo electrónico" labelPlacement="floating" type="email"></ion-input>
  <ion-input label="Contraseña" labelPlacement="floating" type="password"></ion-input>
  <ion-input label="Repetir contraseña" labelPlacement="floating" type="password"></ion-input>

  <ion-button expand="block" routerLink="/app/inicio" routerDirection="root">
    Crear cuenta
  </ion-button>

  <p class="ion-text-center">
    ¿Ya tienes cuenta? <a routerLink="/login" routerDirection="root">Inicia sesión</a>
  </p>
</ion-content>
