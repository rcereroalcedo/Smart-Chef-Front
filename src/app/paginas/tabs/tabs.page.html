<ion-tabs (ionTabsDidChange)="cambiarPestana($event)">
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="inicio">
      <ion-icon [name]="pestanaActiva() === 'inicio' ? 'home' : 'home-outline'"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="buscar">
      <ion-icon [name]="pestanaActiva() === 'buscar' ? 'search' : 'search-outline'"></ion-icon>
      <ion-label>Buscar</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="favoritos">
      <ion-icon [name]="pestanaActiva() === 'favoritos' ? 'heart' : 'heart-outline'"></ion-icon>
      <ion-label>Favoritos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="historial">
      <ion-icon [name]="pestanaActiva() === 'historial' ? 'calendar' : 'calendar-outline'"></ion-icon>
      <ion-label>Historial</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="perfil">
      <ion-icon [name]="pestanaActiva() === 'perfil' ? 'person' : 'person-outline'"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
