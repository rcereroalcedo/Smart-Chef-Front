<ion-content [fullscreen]="true">

  <div class="cabecera">
    <h1>¿Qué tienes en casa?</h1>
    <p>Ingresa lo que tienes en el frigorífico y te diremos qué cocinar.</p>
  </div>

  <!-- Ingredientes elegidos -->
  <div class="caja">
    <app-selector-chips
      [elegidos]="nombresElegidos()"
      [disponibles]="nombresDisponibles()"
      vacio="Aún no has añadido nada."
      (quitar)="quitarPorNombre($event)"
      (anadir)="anadirPorNombre($event)" />
  </div>

  <ion-button
    class="buscar" expand="block"
    [disabled]="resultados().length === 0"
    (click)="titulo.scrollIntoView({ behavior: 'smooth' })">
    {{ resultados().length === 1 ? 'Ver 1 receta' : 'Ver ' + resultados().length + ' recetas' }}
  </ion-button>

  <!-- Resultados -->
  <h2 #titulo class="subtitulo">Recetas que puedes preparar hoy</h2>

  <div class="lista">
    @for (c of resultados(); track c.receta.id; let i = $index) {
      <app-tarjeta-coincidencia class="entrada" [style.--orden]="i" [coincidencia]="c" />
    } @empty {
      <app-estado-vacio
        icono="restaurant-outline"
        titulo="Nada que cocinar todavía"
        texto="Con lo que tienes no llegamos a la mitad de ninguna receta. Prueba a añadir más ingredientes.">
      </app-estado-vacio>
    }
  </div>

</ion-content>
