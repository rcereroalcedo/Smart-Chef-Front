<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Inicio</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/notificaciones">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inicio</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-list>
    <ion-item routerLink="/app/inicio/1" [button]="true"><ion-label>Pollo al limón con arroz</ion-label></ion-item>
    <ion-item routerLink="/app/inicio/2" [button]="true"><ion-label>Pasta carbonara</ion-label></ion-item>
  </ion-list>
</ion-content>
